services:
  dev:
    container_name: raccoon_dev
    image: localhost/raccoon:dev
    deploy:
      resources:
        limits:
          cpus: 6.0
          memory: 4G
    build:
      context: .
      dockerfile: Containerfile
    working_dir: $PWD
    volumes: $PWD:$PWD:Z
    command: sleep infinity
