[language-server.gopls]
command = "podman"
args = ["compose", "exec", "-T", "development", "gopls"]

[language-server.gopls.config]
completeUnimported = false
diagnosticsTrigger = "Save"

[language-server.gopls.config.analyses]
slicesdelete = true

[[language]]
name = "go"
auto-format = true
roots = ["go.work", "go.mod"]
language-servers = [{ name = "gopls", except-features = ["format"] }]
formatter = { command = "podman", args = ["compose", "exec", "-T", "development", "gofmt", "-s"] }
