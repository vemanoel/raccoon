services:
  dev:
    container_name: raccoon_dev
    image: localhost/raccoon:dev
    deploy:
      resources:
        limits:
          cpus: 6.0
          memory: 1G
    build:
      context: ..
      dockerfile: .container/Containerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace:Z
      - ${RACCOON_BROWSER_PROFILE:?RACCOON_BROWSER_PROFILE not defined}:${RACCOON_BROWSER_PROFILE}:ro,Z
    command: sleep infinity

